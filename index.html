<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>City Flight 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9e8;font-family:Arial,sans-serif;touch-action:none}
#game{position:absolute;inset:0}canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #000;z-index:2}
#top{display:flex;justify-content:space-between;padding:12px;align-items:flex-start}
.pill{background:#101827bb;border:1px solid #ffffff33;border-radius:12px;padding:8px 12px;font-size:13px}
#message{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#101827cc;padding:8px 12px;border-radius:10px;max-width:85%;text-align:center;font-size:13px}
#controls{position:absolute;inset:0;pointer-events:none}
.pad{position:absolute;bottom:22px;pointer-events:auto;display:grid;gap:8px}
#leftpad{left:14px;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px)}
#rightpad{right:14px;grid-template-columns:repeat(2,58px);grid-template-rows:repeat(2,58px)}
button{border:1px solid #ffffff55;background:#142033cc;color:white;border-radius:14px;font-weight:bold;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}
button:active{background:#3278c9}
#leftpad .up{grid-column:2;grid-row:1}#leftpad .left{grid-column:1;grid-row:2}#leftpad .down{grid-column:2;grid-row:2}#leftpad .right{grid-column:3;grid-row:2}
#rightpad button{font-size:14px}
#action{position:absolute;left:50%;bottom:155px;transform:translateX(-50%);pointer-events:auto;display:none;background:#12a66a}
#exit{position:absolute;right:14px;top:75px;pointer-events:auto;display:none;background:#b34836}
#mode{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);pointer-events:auto;white-space:nowrap}
#help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#101827ee;padding:20px;border-radius:16px;max-width:85%;text-align:center;pointer-events:auto}
#help button{padding:10px 18px;margin-top:10px}
#map{position:absolute;right:12px;bottom:150px;width:100px;height:100px;border:2px solid #ffffffaa;border-radius:12px;background:#172433aa}
@media(min-width:800px){#leftpad{left:30px;bottom:30px}#rightpad{right:30px;bottom:30px}button{font-size:20px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="top"><div class="pill">✈️ CITY FLIGHT 3D</div><div class="pill" id="status">À pied</div></div>
 <div id="message">Explore la ville ! Approche-toi d'une voiture pour interagir.</div>
 <canvas id="map" width="100" height="100"></canvas>
 <button id="exit">⬅ Sortir</button>
 <button id="action">🚗 Entrer</button>
 <div id="controls">
  <div class="pad" id="leftpad">
   <button class="up" data-key="forward">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="back">▼</button><button class="right" data-key="right">▶</button>
  </div>
  <div class="pad" id="rightpad">
   <button data-key="up">⤴ Monter</button><button data-key="down">⤵ Desc.</button><button data-key="boost">⚡ Vite</button><button data-key="turn">↻ Cam.</button>
  </div>
 </div>
 <button id="mode">✈️ Prendre l'avion</button>
 <div id="help"><b>Bienvenue dans City Flight 3D !</b><br><br>Une ville 3D avec avion, voitures et piétons.<br>Utilise les boutons tactiles pour bouger.<br>Approche d'une voiture pour essayer d'y entrer.<br><button id="start">Jouer</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const container=document.getElementById('game'), msg=document.getElementById('message'), status=document.getElementById('status');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87b9e8); scene.fog=new THREE.Fog(0x87b9e8,170,520);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.6)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; container.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x65717f,2));
const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-80,140,80);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const ground= new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x4e9853));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x33363b), lineMat=mat(0xf4d75b), sidewalk=mat(0x999a9b);
function box(parent,x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function road(x,z,w,d){box(scene,x,.03,z,w,.06,d,roadMat);if(w>d){for(let i=-w/2+8;i<w/2-4;i+=13)box(scene,x+i,.07,z,5,.025,.25,lineMat)}else{for(let i=-d/2+8;i<d/2-4;i+=13)box(scene,x,.07,z+i,.25,.025,5,lineMat)}}
road(0,0,600,18);road(0,0,18,600);road(0,90,600,16);road(0,-90,600,16);road(90,0,16,600);road(-90,0,16,600);road(180,0,16,600);road(-180,0,16,600);
for(let x=-270;x<=270;x+=30)for(let z=-270;z<=270;z+=30){if(Math.abs(x)<22||Math.abs(z)<22||Math.abs(x-90)<20||Math.abs(z-90)<20||Math.abs(x+90)<20||Math.abs(z+90)<20)continue;
box(scene,x,0.15,z,22,.25,22,sidewalk);
let h=12+Math.random()*48,w=10+Math.random()*12,d=10+Math.random()*12;
let colors=[0xb9c4d0,0xc6b8a5,0x8c9ba8,0xd5d1c7,0x9aaeb8,0xb4a0a0];
let building=box(scene,x,h/2+.25,z,w,h,d,mat(colors[Math.floor(Math.random()*colors.length)]));
let wm=mat(0x456b88,.3);
for(let yy=4;yy<h-2;yy+=4){for(let xx=-w/2+2;xx<w/2-1;xx+=3){box(scene,x+xx,yy,z-d/2-.03,1.2,1.5,.08,wm);box(scene,x+xx,yy,z+d/2+.03,1.2,1.5,.08,wm)}}
}
// runway
let runway=box(scene,0,.1,-225,130,.2,25,mat(0x24282c));runway.rotation.y=0;
for(let i=-55;i<=55;i+=11)box(scene,i,.22,-225,4,.03,1.5,mat(0xffffff));
box(scene,0,.22,-225,1,.03,20,mat(0xffffff));
// trees
function tree(x,z){let trunk=box(scene,x,2,z,1,4,1,mat(0x795438));let crown=new THREE.Mesh(new THREE.SphereGeometry(3.2,8,7),mat(0x26783b));crown.position.set(x,5,z);crown.castShadow=true;scene.add(crown)}
for(let i=0;i<100;i++){let x=(Math.random()-.5)*500,z=(Math.random()-.5)*500;if(Math.abs(x%30)<12||Math.abs(z%30)<12)continue;tree(x,z)}
// avatar
function makePerson(color=0x3c76bd){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,4,8),mat(color));body.position.y=1.3;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),mat(0xd9ad8c));head.position.y=2.35;g.add(head);let legs=[];for(let s of [-1,1]){let l=box(g,s*.28,.45,0,.25,.9,.3,mat(0x263244));legs.push(l)}g.userData.legs=legs;g.castShadow=true;return g}
let player=makePerson(0x2d75d2);player.position.set(4,0,5);scene.add(player);
function makeCar(color){let g=new THREE.Group();box(g,0,.65,0,2.2,1.1,4.3,mat(color));box(g,0,1.35,-.25,1.7,.8,2.2,mat(0x8db5c9,.35));let wheels=[];for(let x of [-1.15,1.15])for(let z of [-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,12),mat(0x151515));w.rotation.z=Math.PI/2;w.position.set(x,.4,z);g.add(w);wheels.push(w)}g.userData.wheels=wheels;g.castShadow=true;return g}
let cars=[];for(let i=0;i<24;i++){let c=makeCar([0xc94c43,0x4778bd,0xe1d9a8,0x33383c,0x42a17a,0xc4c4c4][i%6]);let horizontal=i%2===0;c.position.set(horizontal?-240+Math.random()*480:(i%2?90:-90),0,horizontal?(i%4?90:-90):-240+Math.random()*480);c.rotation.y=horizontal?0:Math.PI/2;scene.add(c);cars.push({mesh:c,dir:horizontal?1:-1,axis:horizontal?'x':'z',speed:7+Math.random()*6,occupied:false})}
let people=[];for(let i=0;i<38;i++){let p=makePerson([0x9b5dcb,0xd67a33,0x328b85,0xe3bb4e][i%4]);p.position.set((Math.random()-.5)*400,0,(Math.random()-.5)*400);scene.add(p);people.push({mesh:p,angle:Math.random()*Math.PI*2,walk:2+Math.random()*2})}
// plane
function makePlane(){let g=new THREE.Group(), white=mat(0xe6edf3), blue=mat(0x3478c9), dark=mat(0x222b36);box(g,0,0,0,2.5,1.3,8,white);box(g,0,.15,-.3,17,.25,2.1,white);box(g,0,.1,2.4,5,.25,1.1,white);box(g,0,.35,-2.7,1.5,.8,2.2,blue);box(g,0,.2,-3.9,1.2,.25,1.4,white);box(g,0,1.1,0,1.5,.7,2.2,mat(0x83b6d4,.25));for(let x of [-1.7,1.7]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.25,12),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x,-.7,2);g.add(wheel)}g.castShadow=true;return g}
let plane=makePlane();plane.position.set(0,4,-200);scene.add(plane);
let mode='walk', activeCar=null, targetCar=null, planeSpeed=0, vehicleSpeed=0, camYaw=0, camPitch=.25;
const keys={};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function setMode(m){mode=m;status.textContent=m==='walk'?'À pied':m==='plane'?'Avion':'Voiture';document.getElementById('exit').style.display=m==='walk'?'none':'block';document.getElementById('mode').style.display=m==='plane'?'none':'block';}
document.getElementById('start').onclick=()=>document.getElementById('help').style.display='none';
document.getElementById('mode').onclick=()=>{if(mode==='walk'){plane.position.copy(player.position);plane.position.y=3;plane.rotation.y=player.rotation.y;setMode('plane');msg.textContent='Pilote ton avion !';}else{setMode('walk')}};
document.getElementById('exit').onclick=()=>{if(mode==='plane'){player.position.copy(plane.position);player.position.y=0;player.rotation.y=plane.rotation.y;setMode('walk')}else if(mode==='car'&&activeCar){player.position.copy(activeCar.mesh.position);player.position.x+=3;activeCar.occupied=false;activeCar=null;setMode('walk')}};
document.getElementById('action').onclick=()=>{if(targetCar&&mode==='walk'){activeCar=targetCar;activeCar.occupied=true;player.visible=false;setMode('car');msg.textContent='Tu conduis ! Appuie sur Sortir pour quitter.'}};
const map=document.getElementById('map'),ctx=map.getContext('2d');
function drawMap(){ctx.clearRect(0,0,100,100);ctx.fillStyle='#426849';ctx.fillRect(0,0,100,100);ctx.fillStyle='#555';ctx.fillRect(46,0,8,100);ctx.fillRect(0,46,100,8);ctx.fillRect(76,0,5,100);ctx.fillRect(0,76,100,5);ctx.fillStyle='#aaa';ctx.fillRect(7,5,22,4);ctx.fillStyle='#fff';let obj=mode==='plane'?plane:mode==='car'&&activeCar?activeCar.mesh:player;ctx.fillRect(48+(obj.position.x/600)*40,48+(obj.position.z/600)*40,4,4)}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);
let forward=keys.forward||keys.w,back=keys.back||keys.s,left=keys.left||keys.a,right=keys.right||keys.d,up=keys.up,down=keys.down,boost=keys.boost;
if(mode==='walk'){if(forward||back){player.position.x+=Math.sin(player.rotation.y)*(forward?1:-1)*7*dt;player.position.z+=Math.cos(player.rotation.y)*(forward?1:-1)*7*dt}if(left)player.rotation.y+=2.5*dt;if(right)player.rotation.y-=2.5*dt;player.position.y=0}
if(mode==='plane'){planeSpeed+=(forward?20:back?-12:0)*dt;planeSpeed*=Math.pow(.94,dt*60);planeSpeed=Math.max(0,Math.min(65,planeSpeed+(boost?15*dt:0)));plane.position.x+=Math.sin(plane.rotation.y)*planeSpeed*dt;plane.position.z+=Math.cos(plane.rotation.y)*planeSpeed*dt;if(left)plane.rotation.y+=.8*dt;if(right)plane.rotation.y-=.8*dt;if(up)plane.position.y+=12*dt;if(down)plane.position.y-=12*dt;plane.position.y=Math.max(1,Math.min(90,plane.position.y));plane.rotation.z=THREE.MathUtils.lerp(plane.rotation.z,left?.35:right?-.35:0,dt*3);if(plane.position.y<8&&Math.abs(plane.position.x)<65&&plane.position.z<-205&&planeSpeed<15)planeSpeed=0}
if(mode==='car'&&activeCar){vehicleSpeed+=(forward?18:back?-12:0)*dt;vehicleSpeed*=Math.pow(.96,dt*60);vehicleSpeed=Math.max(-12,Math.min(38,vehicleSpeed+(boost?12*dt:0)));activeCar.mesh.position.x+=Math.sin(activeCar.mesh.rotation.y)*vehicleSpeed*dt;activeCar.mesh.position.z+=Math.cos(activeCar.mesh.rotation.y)*vehicleSpeed*dt;if(left)activeCar.mesh.rotation.y+=1.5*dt;if(right)activeCar.mesh.rotation.y-=1.5*dt;activeCar.mesh.userData.wheels.forEach(w=>w.rotation.x+=vehicleSpeed*dt*2)}
cars.forEach(c=>{if(c.occupied||c===activeCar)return;c.mesh.position[c.axis]+=c.dir*c.speed*dt;if(Math.abs(c.mesh.position[c.axis])>280)c.mesh.position[c.axis]=-280;c.mesh.userData.wheels.forEach(w=>w.rotation.x+=c.speed*dt)});
people.forEach(p=>{p.angle+=Math.sin(p.angle*2)*.1*dt;p.mesh.position.x+=Math.sin(p.angle)*p.walk*dt;p.mesh.position.z+=Math.cos(p.angle)*p.walk*dt;if(Math.abs(p.mesh.position.x)>220||Math.abs(p.mesh.position.z)>220)p.angle+=Math.PI;p.mesh.rotation.y=p.angle});
let pos=mode==='plane'?plane.position:mode==='car'&&activeCar?activeCar.mesh.position:player.position, rot=mode==='plane'?plane.rotation.y:mode==='car'&&activeCar?activeCar.mesh.rotation.y:player.rotation.y;
targetCar=null;let nearest=999;cars.forEach(c=>{if(c.occupied)return;let d=pos.distanceTo(c.mesh.position);if(d<nearest){nearest=d;targetCar=c}});
let action=document.getElementById('action');action.style.display=mode==='walk'&&nearest<7?'block':'none';
if(nearest<7&&mode==='walk')msg.textContent='Une voiture est proche : appuie sur 🚗 Entrer';else if(mode==='walk')msg.textContent='Explore la ville et approche-toi des voitures.';else if(mode==='plane')msg.textContent='Vitesse : '+Math.round(planeSpeed)+' | Altitude : '+Math.round(plane.position.y);else msg.textContent='Vitesse : '+Math.round(Math.abs(vehicleSpeed));
let desired=new THREE.Vector3(pos.x-Math.sin(rot)*18,pos.y+(mode==='plane'?6:8)+camPitch*5,pos.z-Math.cos(rot)*18);camera.position.lerp(desired,dt*4);camera.lookAt(pos.x,pos.y+(mode==='plane'?1:1.4),pos.z);
drawMap();renderer.render(scene,camera)}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body></html>
